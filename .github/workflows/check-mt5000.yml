name: Check GL-MT5000 configuration

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mt5000-custom
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            subversion \
            swig

      - name: Verify source
        run: |
          set -eux
          git log --oneline -3
          git merge-base --is-ancestor \
            8461b1b79b3f251a5758cd4035d506e38a602e6b \
            HEAD
          grep -q 'country-code@88' \
            target/linux/mediatek/dts/mt7987a-glinet-gl-mt5000.dts

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Generate target configuration
        run: |
          make defconfig

      - name: Dump target information
        run: |
          make -s targetinfo

      - name: Find MT5000 configuration
        run: |
          grep -Rni \
            'gl-mt5000\|glinet_gl-mt5000' \
            tmp/ \
            target/ \
            2>/dev/null || true
