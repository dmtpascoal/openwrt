name: Build GL-MT5000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mt5000-custom
          fetch-depth: 0

      - name: Free disk space
        run: |
          # kmod-amneziawg copies the whole kernel build tree into its build dir.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            subversion \
            swig \
            time \
            xsltproc

      - name: Verify source revision
        run: |
          set -eux

          echo "HEAD:"
          git rev-parse HEAD

          echo
          echo "Recent commits:"
          git log --oneline -8

          echo
          echo "Checking required MT5000 changes:"

          # dmsza's review-feedback update (openwrt#24237); stable upstream SHA.
          git merge-base --is-ancestor \
            8461b1b79b3f251a5758cd4035d506e38a602e6b \
            HEAD

          # Kyklas's factory NVMEM cells (checked by content: SHA changes on rebase).
          grep -q 'country-code@88' \
            target/linux/mediatek/dts/mt7987a-glinet-gl-mt5000.dts

          echo "Required MT5000 commits are present."

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Configure GL-MT5000
        run: |
          set -eux

          cat > .config <<'CONFIG'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_TARGET_ROOTFS_TARGZ=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_INITRAMFS_COMPRESSION_GZIP=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-f2fs=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-mmc=y
          CONFIG_PACKAGE_mkf2fs=y
          CONFIG_PACKAGE_blkid=y
          CONFIG_PACKAGE_blockdev=y
          CONFIG_PACKAGE_kmod-mt7987-2p5g-phy-firmware=y
          CONFIG_PACKAGE_kmod-amneziawg=y
          CONFIG_PACKAGE_amneziawg-tools=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-proto-amneziawg=y
          CONFIG

          make defconfig

          echo
          echo "Selected target:"
          grep '^CONFIG_TARGET' .config

          echo
          echo "MT5000 selection:"
          grep 'CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000' .config

          echo
          echo "AmneziaWG selection:"
          grep -x 'CONFIG_PACKAGE_kmod-amneziawg=y' .config
          grep -x 'CONFIG_PACKAGE_amneziawg-tools=y' .config

          echo
          echo "LuCI selection:"
          grep -x 'CONFIG_PACKAGE_luci=y' .config
          grep -x 'CONFIG_PACKAGE_luci-proto-amneziawg=y' .config

      - name: Download sources
        run: make download -j2

      - name: Build
        run: make -j2 V=s

      - name: List firmware
        run: |
          set -eux
          df -h /
          find bin -name '*amneziawg*' -print
          ls -lah bin/targets/mediatek/filogic

      - name: Generate checksums
        run: |
          cd bin/targets/mediatek/filogic
          find . -maxdepth 1 -type f ! -name sha256sums.txt -print0 |
            sort -z |
            xargs -0 sha256sum > sha256sums.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: gl-mt5000-firmware
          path: |
            bin/targets/mediatek/filogic/*.bin
            bin/targets/mediatek/filogic/*.itb
            bin/targets/mediatek/filogic/*.gz
            bin/targets/mediatek/filogic/*.img
            bin/targets/mediatek/filogic/sha256sums.txt
            bin/targets/mediatek/filogic/config.buildinfo
            bin/targets/mediatek/filogic/feeds.buildinfo
            bin/targets/mediatek/filogic/version.buildinfo
            bin/targets/mediatek/filogic/packages/kmod-amneziawg*
            bin/packages/*/amneziawg/*
          if-no-files-found: error
