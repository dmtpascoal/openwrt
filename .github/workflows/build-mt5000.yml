name: Build GL-MT5000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mt5000-custom
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            subversion \
            swig \
            time \
            xsltproc

      - name: Verify source revision
        run: |
          set -eux

          echo "HEAD:"
          git rev-parse HEAD

          echo
          echo "Recent commits:"
          git log --oneline -5

          echo
          echo "Checking MT5000 firmware base commit:"
          git merge-base --is-ancestor \
            63f6835edc843bf23af2234f9a51ab77e703c44f \
            HEAD

          echo "Required MT5000 commit is present in this branch."

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Verify MT5000 source
        run: |
          set -eux

          echo "MT5000 device definition:"
          sed -n '/define Device\/glinet_gl-mt5000/,/endef/p' \
            target/linux/mediatek/image/filogic.mk

          echo
          echo "MT5000 DTS:"
          grep -n \
            'model =\|compatible =\|reset-gpios\|ddns@\|sn-bak@\|sn@\|country-code@' \
            target/linux/mediatek/dts/mt7987a-gl-mt5000.dts

      - name: Configure target
        run: |
          set -eux

          cat > .config <<'CONFIG'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_TARGET_ROOTFS_TARGZ=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_INITRAMFS_COMPRESSION_GZIP=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-f2fs=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-mmc=y
          CONFIG_PACKAGE_mkf2fs=y
          CONFIG_PACKAGE_blkid=y
          CONFIG_PACKAGE_blockdev=y
          CONFIG_PACKAGE_kmod-mt7987-2p5g-phy-firmware=y
          CONFIG

          make defconfig

          echo
          echo "Selected target:"
          grep '^CONFIG_TARGET' .config

          echo
          echo "MT5000 configuration:"
          grep -i 'mt5000\|glinet' .config || true

      - name: Verify target selection
        run: |
          set -eux

          grep -q '^CONFIG_TARGET_mediatek=y$' .config
          grep -q '^CONFIG_TARGET_mediatek_filogic=y$' .config
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000=y$' .config

          echo "GL-MT5000 target selected successfully."

      - name: Download sources
        run: make download -j2

      - name: Build
        run: make -j2 V=s

      - name: List firmware
        run: |
          ls -lah bin/targets/mediatek/filogic

      - name: Generate checksums
        run: |
          cd bin/targets/mediatek/filogic
          sha256sum * > sha256sums.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: gl-mt5000-firmware
          path: |
            bin/targets/mediatek/filogic/*.bin
            bin/targets/mediatek/filogic/*.itb
            bin/targets/mediatek/filogic/*.gz
            bin/targets/mediatek/filogic/*.img
            bin/targets/mediatek/filogic/sha256sums.txt
            bin/targets/mediatek/filogic/config.buildinfo
            bin/targets/mediatek/filogic/feeds.buildinfo
            bin/targets/mediatek/filogic/version.buildinfo
          if-no-files-found: error
