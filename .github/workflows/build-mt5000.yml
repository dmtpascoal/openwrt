name: Build GL-MT5000

# Builds an OpenWrt image for the GL.iNet GL-MT5000 (Brume 3). With source
# "latest" (the default) the tree is the current openwrt/openwrt main with
# the commits of PR #24237 rebased on top; with "branch" it is the branch the
# workflow is started on. Package feeds are always fetched at their latest
# revision. The base image is the device plus LuCI and USB 3; extra packages
# come from the opt-in profiles in .github/mt5000/profiles/
# (e.g. "amneziawg wireguard adguardhome avahi usb-storage usb-tethering").
# The versions that went into a build are in the job summary and in
# versions.md in the firmware artifact.
#
# Optional repository secret APK_SIGNING_KEY: an EC prime256v1 private key in
# PEM format. When set, every build signs packages with the same key, so
# packages from later builds can be installed on a flashed router.

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: "Space-separated extra profiles from .github/mt5000/profiles"
        required: false
        default: ""
      source:
        description: "latest: current main + PR #24237; branch: this branch as pushed"
        required: false
        type: choice
        options: [latest, branch]
        default: latest

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PROFILES: ${{ inputs.profiles }}
      TARGET_DIR: bin/targets/mediatek/filogic

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history without file contents, so the PR can be rebased.
          fetch-depth: 0
          filter: blob:none

      - name: Rebase PR #24237 onto the latest main
        if: inputs.source != 'branch'
        run: |
          set -eu
          git config user.name "mt5000 ci"
          git config user.email "ci@localhost"
          git remote add upstream https://github.com/openwrt/openwrt.git
          git fetch --no-tags upstream main +refs/pull/24237/head:refs/remotes/upstream/pr24237
          base=$(git merge-base upstream/main upstream/pr24237)
          git checkout -B mt5000-build upstream/pr24237
          # Commits that are already in main are dropped by the rebase.
          if ! git rebase --onto upstream/main "$base"; then
            git rebase --abort
            echo "::error::PR #24237 no longer rebases onto main; run with source=branch"
            exit 1
          fi
          # Keep this branch's workflow, base config and profiles.
          git checkout "$GITHUB_SHA" -- .github
          git log --oneline upstream/main..HEAD

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync unzip \
            zlib1g-dev file wget subversion swig time xsltproc ccache
          df -h /

      - name: Validate profiles
        run: |
          set -eu
          for p in $PROFILES; do
            test -f ".github/mt5000/profiles/$p.config" || {
              echo "::error::unknown profile '$p'"; exit 1; }
          done

      - name: Check device support is present
        run: |
          set -eu
          grep -q 'Device/glinet_gl-mt5000' target/linux/mediatek/image/filogic.mk
          test -f target/linux/mediatek/dts/mt7987a-glinet-gl-mt5000.dts
          grep -qx 'CONFIG_NET_DSA_REALTEK_RTL8366UB=y' target/linux/mediatek/filogic/config-6.18
          for n in 10 11; do
            ls target/linux/generic/pending-6.18/795-$n-*.patch >/dev/null
          done

      - name: Set up Go (AdGuard Home)
        if: contains(inputs.profiles, 'adguardhome')
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ github.run_id }}
          restore-keys: dl-

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Feeds
        run: |
          set -eu
          cp feeds.conf.default feeds.conf
          for p in $PROFILES; do
            f=".github/mt5000/profiles/$p.feeds"
            [ -f "$f" ] && cat "$f" >> feeds.conf
          done
          ./scripts/feeds update -a
          for p in $PROFILES; do
            h=".github/mt5000/profiles/$p.post-feeds.sh"
            [ -x "$h" ] && "$h"
          done
          ./scripts/feeds install -a

      - name: Record versions
        run: |
          set -eu
          kver=$(sed -n 's/^LINUX_VERSION-6.18 = //p' target/linux/generic/kernel-6.18)
          {
            echo "## Sources"
            echo "- source: ${{ inputs.source || 'latest' }}"
            echo "- tree: \`$(git log -1 --format='%h %s (%cs)')\`"
            if git rev-parse -q --verify upstream/main >/dev/null; then
              echo "- openwrt main: \`$(git log -1 --format='%h %s (%cs)' upstream/main)\`"
              echo "- PR #24237 head: \`$(git log -1 --format='%h %s (%cs)' upstream/pr24237)\`"
            fi
            echo "- kernel: 6.18$kver"
            echo "## Feeds"
            for d in feeds/*/; do
              [ -d "$d.git" ] || continue
              echo "- $(basename "$d"): \`$(git -C "$d" log -1 --format='%h (%cs)')\`"
            done
            echo "## Profiles"
            echo "- ${PROFILES:-none}"
          } | tee versions.md >> "$GITHUB_STEP_SUMMARY"

      - name: Configure
        run: |
          set -eu
          {
            cat .github/mt5000/default.config
            for p in $PROFILES; do cat ".github/mt5000/profiles/$p.config"; done
            # Build speed: compiler cache, and skip the toolchain debugger.
            echo CONFIG_DEVEL=y
            echo CONFIG_CCACHE=y
            echo CONFIG_TOOLCHAINOPTS=y
            echo '# CONFIG_GDB is not set'
            if command -v go >/dev/null; then
              echo "CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT=\"$(go env GOROOT)\""
            fi
          } > .config
          cp .config requested.config
          make defconfig
          # Every package that was asked for must have survived defconfig.
          missing=0
          for sym in $(grep -oE '^CONFIG_PACKAGE_[^=]+=y' requested.config); do
            grep -qx "$sym" .config || { echo "::error::$sym dropped by defconfig"; missing=1; }
          done
          [ "$missing" = 0 ]
          grep -x 'CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000=y' .config

      - name: Package signing key
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          if [ -n "$APK_SIGNING_KEY" ]; then
            printf '%s\n' "$APK_SIGNING_KEY" > private-key.pem
            chmod 600 private-key.pem
            echo "Using the persistent package signing key."
          else
            echo "::notice::No APK_SIGNING_KEY secret; packages are signed with a throwaway key."
          fi

      - name: Download sources
        run: make download -j8 || make download -j1 V=s

      - name: Build
        run: make -j$(nproc) || make -j1 V=s

      - name: Verify output
        run: |
          set -eu
          ls -lah "$TARGET_DIR"
          for img in squashfs-sysupgrade.bin squashfs-factory.bin initramfs-kernel.bin; do
            test -s "$TARGET_DIR/openwrt-mediatek-filogic-glinet_gl-mt5000-$img"
          done
          manifest="$TARGET_DIR/openwrt-mediatek-filogic-glinet_gl-mt5000.manifest"
          test -s "$manifest"
          missing=0
          for pkg in $(grep -oE '^CONFIG_PACKAGE_[^=]+=y' requested.config | sed 's/^CONFIG_PACKAGE_//; s/=y$//'); do
            grep -q "^$pkg " "$manifest" || { echo "::error::$pkg missing from the image"; missing=1; }
          done
          [ "$missing" = 0 ]
          if grep -qx 'CONFIG_PACKAGE_kmod-amneziawg=y' .config; then
            ko=$(find build_dir -name amneziawg.ko | head -1); test -n "$ko"
            kver=$(sed -n 's/^LINUX_VERSION-6.18 = //p' target/linux/generic/kernel-6.18)
            strings "$ko" | grep -q "^vermagic=6.18$kver "
          fi
          case " $PROFILES " in *" amneziawg-server "*)
            ls build_dir/target-*/root-mediatek/etc/uci-defaults/90-amneziawg-server ;;
          esac

      - name: Upload images
        uses: actions/upload-artifact@v5
        with:
          name: gl-mt5000-firmware
          if-no-files-found: error
          path: |
            ${{ env.TARGET_DIR }}/*glinet_gl-mt5000*
            ${{ env.TARGET_DIR }}/sha256sums
            ${{ env.TARGET_DIR }}/*.buildinfo
            versions.md

      - name: Upload packages
        uses: actions/upload-artifact@v5
        with:
          name: gl-mt5000-packages
          if-no-files-found: error
          path: |
            ${{ env.TARGET_DIR }}/packages
            bin/packages
